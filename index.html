<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prix du BTC en direct</title>
<style>
  /* ====== Style façon Bitbo : fond sombre, prix orange, indicateur "live" ====== */
  .btc-ticker {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #0d1117;
    color: #f7931a; /* orange Bitcoin */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .btc-ticker__icon { font-size: 28px; line-height: 1; }
  .btc-ticker__price { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
  .btc-ticker__change { font-size: 15px; font-weight: 600; }
  .btc-ticker__change.up   { color: #3fb950; }
  .btc-ticker__change.down { color: #f85149; }
  .btc-ticker__live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
  }
  .btc-ticker__dot {
    width: 8px; height: 8px; border-radius: 50%; background: #3fb950;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(63,185,80,.6); }
    70%  { box-shadow: 0 0 0 8px rgba(63,185,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
  }
</style>
</head>
<body style="background:#161b22; padding:40px; text-align:center;">

  <!-- ====== C'est ce bloc qu'il faut copier sur ton site ====== -->
  <div class="btc-ticker" id="btcTicker">
    <span class="btc-ticker__icon">₿</span>
    <div>
      <div><span class="btc-ticker__price" id="btcPrice">--</span>
           <span class="btc-ticker__change" id="btcChange"></span></div>
      <div class="btc-ticker__live"><span class="btc-ticker__dot"></span> Live</div>
    </div>
  </div>

  <script>
  (function () {
    // Devise affichée : "usd", "eur" ou "cad"
    var CURRENCY = "usd";
    // Fréquence de rafraîchissement (en millisecondes). CoinGecko public tolère
    // largement un appel toutes les 15-30 secondes sans clé API.
    var REFRESH_MS = 20000;

    var priceEl  = document.getElementById("btcPrice");
    var changeEl = document.getElementById("btcChange");

    function formatPrice(value) {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: CURRENCY.toUpperCase(),
        maximumFractionDigits: 0
      }).format(value);
    }

    // Source n°1 : CoinGecko — endpoint public, gratuit, sans clé API, avec CORS.
    function fetchFromCoinGecko() {
      var url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=" +
                CURRENCY + "&include_24hr_change=true";
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("CoinGecko HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        return {
          price: data.bitcoin[CURRENCY],
          change: data.bitcoin[CURRENCY + "_24h_change"]
        };
      });
    }

    // Source n°2 (secours) : Binance — public aussi, sans clé, si CoinGecko est
    // indisponible ou bloqué (ex. limite de débit atteinte).
    function fetchFromBinance() {
      var pair = "BTC" + CURRENCY.toUpperCase();
      var url = "https://api.binance.com/api/v3/ticker/24hr?symbol=" + pair;
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("Binance HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        return {
          price: parseFloat(data.lastPrice),
          change: parseFloat(data.priceChangePercent)
        };
      });
    }

    function update() {
      fetchFromCoinGecko()
        .catch(fetchFromBinance)
        .then(function (result) {
          priceEl.textContent = formatPrice(result.price);
          var pct = result.change;
          changeEl.textContent = (pct >= 0 ? "▲ +" : "▼ ") + pct.toFixed(2) + "%";
          changeEl.className = "btc-ticker__change " + (pct >= 0 ? "up" : "down");
        })
        .catch(function (err) {
          console.error("Impossible de récupérer le prix du BTC :", err);
          priceEl.textContent = "Erreur";
        });
    }

    update();
    setInterval(update, REFRESH_MS);
  })();
  </script>

</body>
</html>
