<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prix du BTC en direct (WebSocket temps réel)</title>
<style>
  /* ====== Style façon Bitbo : fond sombre, prix orange, indicateur "live" ====== */
  .btc-ticker {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #0d1117;
    color: #f7931a; /* orange Bitcoin */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .btc-ticker__icon { font-size: 28px; line-height: 1; }
  .btc-ticker__price {
    font-size: 28px; font-weight: 700; letter-spacing: .5px;
    transition: color .15s ease;
  }
  .btc-ticker__price.flash-up   { color: #3fb950 !important; }
  .btc-ticker__price.flash-down { color: #f85149 !important; }
  .btc-ticker__change { font-size: 15px; font-weight: 600; margin-left: 8px; }
  .btc-ticker__change.up   { color: #3fb950; }
  .btc-ticker__change.down { color: #f85149; }
  .btc-ticker__live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
  }
  .btc-ticker__dot {
    width: 8px; height: 8px; border-radius: 50%; background: #3fb950;
    animation: pulse 1.6s infinite;
  }
  .btc-ticker__dot.offline { background: #f85149; animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(63,185,80,.6); }
    70%  { box-shadow: 0 0 0 8px rgba(63,185,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
  }
</style>
</head>
<body style="background:#161b22; padding:40px; text-align:center;">

  <!-- ====== C'est ce bloc qu'il faut copier sur ton site ====== -->
  <div class="btc-ticker" id="btcTicker">
    <span class="btc-ticker__icon">₿</span>
    <div>
      <div>
        <span class="btc-ticker__price" id="btcPrice">--</span>
        <span class="btc-ticker__change" id="btcChange"></span>
      </div>
      <div class="btc-ticker__live">
        <span class="btc-ticker__dot" id="btcDot"></span>
        <span id="btcStatus">Connexion...</span>
      </div>
    </div>
  </div>

  <script>
  (function () {
    // Paire suivie. BTCUSDT = Bitcoin en dollars US (paire la plus liquide,
    // donc celle qui "tick" le plus souvent — plusieurs fois par seconde).
    var SYMBOL = "btcusdt";
    var CURRENCY = "USD";

    var priceEl  = document.getElementById("btcPrice");
    var changeEl = document.getElementById("btcChange");
    var dotEl    = document.getElementById("btcDot");
    var statusEl = document.getElementById("btcStatus");

    var lastPrice = null;
    var openPrice24h = null; // pour calculer la variation sur 24h
    var ws = null;
    var reconnectDelay = 1000;

    function formatPrice(value) {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: CURRENCY,
        maximumFractionDigits: 2
      }).format(value);
    }

    function applyPrice(newPrice) {
      var flashClass = null;
      if (lastPrice !== null) {
        if (newPrice > lastPrice) flashClass = "flash-up";
        else if (newPrice < lastPrice) flashClass = "flash-down";
      }
      lastPrice = newPrice;
      priceEl.textContent = formatPrice(newPrice);

      if (flashClass) {
        priceEl.classList.remove("flash-up", "flash-down");
        void priceEl.offsetWidth; // force le redémarrage de la transition CSS
        priceEl.classList.add(flashClass);
      }

      if (openPrice24h) {
        var pct = ((newPrice - openPrice24h) / openPrice24h) * 100;
        changeEl.textContent = (pct >= 0 ? "▲ +" : "▼ ") + pct.toFixed(2) + "% (24h)";
        changeEl.className = "btc-ticker__change " + (pct >= 0 ? "up" : "down");
      }
    }

    function setStatus(text, offline) {
      statusEl.textContent = text;
      dotEl.classList.toggle("offline", !!offline);
    }

    // Récupère une première valeur + le prix d'ouverture 24h via une simple
    // requête REST publique (pas de clé), le temps que le WebSocket se connecte.
    function loadInitial() {
      fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=" + SYMBOL.toUpperCase())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          openPrice24h = parseFloat(d.openPrice);
          applyPrice(parseFloat(d.lastPrice));
        })
        .catch(function () { /* le WebSocket prendra le relais de toute façon */ });
    }

    // ====== Le vrai temps réel : WebSocket public Binance, sans clé API ======
    // Le flux "@trade" pousse un message à CHAQUE transaction exécutée sur la
    // paire, donc en pratique plusieurs fois par seconde pour BTCUSDT : c'est
    // ça qui donne un prix qui change vraiment "en direct" et pas juste
    // rafraîchi toutes les X secondes.
    function connect() {
      setStatus("Connexion...");
      ws = new WebSocket("wss://stream.binance.com:9443/ws/" + SYMBOL + "@trade");

      ws.onopen = function () {
        setStatus("Live");
        reconnectDelay = 1000; // reset du délai de reconnexion
      };

      ws.onmessage = function (event) {
        var data = JSON.parse(event.data);
        // "p" = prix de la transaction dans le message @trade de Binance
        applyPrice(parseFloat(data.p));
      };

      ws.onerror = function () {
        setStatus("Erreur de connexion", true);
      };

      ws.onclose = function () {
        setStatus("Reconnexion...", true);
        // Reconnexion automatique avec un délai croissant (max 15s)
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 15000);
      };
    }

    loadInitial();
    connect();
  })();
  </script>

</body>
</html>
